services:

  db:
    image: mysql:8
    container_name: kinoxp-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kinoxp
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: kinoxp-app
    environment:
      DB_URL: jdbc:mysql://db:3306/kinoxp
      DB_USERNAME: root
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
